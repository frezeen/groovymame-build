name: Build libretro-MAME

# Build del core libretro-mame (mame_libretro.so, x64) su GitHub Actions.
# Workflow COMPLETAMENTE SEPARATO da build-mame.yml (GroovyMAME): suo cron, suo processo,
# suo artifact/release. Non condivide nulla con il build di GroovyMAME.
#  - manuale (workflow_dispatch): input libretro_tag, vuoto = ultimo
#  - automatico (schedule): ogni giorno controlla se su libretro/mame e' uscito un nuovo
#    tag lrmame0*; se si (e non e' gia' stato rilasciato), builda e pubblica il core come Release.
#
# NOTA: il comando di build e' allineato a quello di Batocera
# (package/batocera/emulators/retroarch/libretro/libretro-mame/libretro-mame.mk) per x86_64.

on:
  workflow_dispatch:
    inputs:
      libretro_tag:
        description: 'libretro-mame tag (lrmame0*). Vuoto = ultimo tag trovato.'
        default: ''
        required: false
      force:
        description: 'Rebuild forzato anche se la release esiste già'
        type: boolean
        default: false
  schedule:
    - cron: '47 4 * * *'     # cron separato da build-mame (03:17)

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Determina il tag da buildare (lrmame0*, dinamico)
        id: decide
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag: input manuale se fornito, altrimenti ultimo lrmame0* (dinamico)
          TAG="${{ github.event.inputs.libretro_tag || '' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/libretro/mame/git/refs/tags" \
              | grep -oE 'refs/tags/lrmame0[0-9]+' \
              | sed 's#refs/tags/##' | sort -uV | tail -1)
            echo "auto-detect -> $TAG"
          else
            echo "dispatch manuale -> $TAG"
          fi
          if [ -z "$TAG" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Release gia' esistente e non forzata -> skip
          if [ "$FORCE" != "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG gia' esistente -> skip"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "release $TAG assente o forzata -> build"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git build-essential ccache nasm python3 pkg-config binutils upx \
            libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev \
            libxinerama-dev libxrandr-dev libudev-dev libzstd-dev \
            libjpeg-dev libpng-dev libsqlite3-dev libexpat1-dev rapidjson-dev libglm-dev
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: lrmame-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lrmame-${{ runner.os }}-
      - name: Checkout libretro/mame
        run: git clone --depth 1 --branch ${{ github.event.inputs.libretro_tag || needs.check.outputs.tag }} https://github.com/libretro/mame.git lm
      - name: Build core (allineato a Batocera libretro-mame.mk, x86_64)
        env:
          CCACHE_DIR: /home/runner/.ccache
          # ccache col PCH: senza sloppiness+pch_extsum l'84% delle compilazioni
          # resta uncacheable (could_not_use_precompiled_header) e la cache da
          # 10G non serve a nulla. Stesse impostazioni del workflow GroovyMAME.
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_ctime,include_file_mtime
          CCACHE_PCH_EXTSUM: "1"
          CCACHE_COMPILERCHECK: content
          CCACHE_COMPRESSLEVEL: "1"
        run: |
          set -euo pipefail
          cd lm
          ccache -M 10G
          # Il PCH (emu.h.gch, 255MB) viene hashed come .sum: 69 byte invece di 255MB
          GCH=build/linux_gcc/obj/x64/Release/emu.h.gch
          [ -f "$GCH" ] || GCH=build/projects/retro/mame/gmake-linux/../../../linux_gcc/obj/x64/Release/emu.h.gch
          ( for _ in $(seq 1 3600); do
              G=$(find build -name emu.h.gch -type f 2>/dev/null | head -1)
              if [ -n "$G" ]; then
                s1=$(stat -c %s "$G"); sleep 4; s2=$(stat -c %s "$G")
                if [ "$s1" = "$s2" ] && [ "$s1" -gt 100000000 ]; then
                  sha256sum "$G" > "$G.sum" && echo "PCH.sum creato ($(basename "$G"))"
                  break
                fi
              fi
              sleep 3
            done ) &
          # job limit basato sulla RAM (Batocera fa cosi': evita OOM sul runner)
          JOBS=$(( $(grep MemTotal /proc/meminfo | awk '{print $2}') / 1024 / 1024 / 2 + 1 ))
          [ "$JOBS" -gt "$(nproc)" ] && JOBS=$(nproc)
          # diagnostica: la run del 08/08/2026 ha compilato 9558 file in 3h15
          # (4,9s/file) contro 2,4s/file della build GroovyMAME: stessa soglia,
          # stesso PCH, nessuno stall -> si vuole sapere con chehwgardware.
          echo "=== CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs) ==="
          echo "=== nproc=$(nproc)  MemTotal=$(grep MemTotal /proc/meminfo)  JOBS=$JOBS ==="
          echo "=== compiler: $(g++ --version | head -1) ==="
          SECONDS=0
          make -j"$JOBS" -C ./ \
            linux_x64 OPENMP=1 REGENIE=1 NOWERROR=1 PRECOMPILE=1 \
            PYTHON_EXECUTABLE=python3 CONFIG=libretro LIBRETRO_OS="unix" \
            ARCH="" PROJECT="" ARCHOPTS="" OPTIMIZE=2 \
            CXXFLAGS="-ffunction-sections -fdata-sections" \
            LDOPTS="-Wl,--gc-sections -Wl,-z,pack-relative-relocs" \
            OVERRIDE_CC='ccache gcc' OVERRIDE_CXX='ccache g++' OVERRIDE_LD='ccache g++' \
            RANLIB='ranlib' AR='ar' \
            PTR64=1 LIBRETRO_CPU=x86_64 PLATFORM=x86 \
            CROSS_BUILD=1 TARGET="mame" SUBTARGET="mame" RETRO=1 OSD="retro" DEBUG=0
          wait || true
          echo "=== compile+link durata: $((SECONDS/60))m$((SECONDS%60))s  con JOBS=$JOBS ==="
          ccache -s
          ls -la mame_libretro.so
          strip -v mame_libretro.so || true
          # upx DEFAULT, non --best: sulla .so da 316MB --best ci mette 29 minuti
          # per ~1-2MB in piu' (misurato run #31241725451: 29m04s).
          time upx mame_libretro.so || true
      - name: Pubblica GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          ASSET=lm/mame_libretro.so
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "libretro-mame $TAG" \
              --notes "Core libretro MAME (x64) build automatico GitHub Actions (allineato a Batocera)."
          fi
